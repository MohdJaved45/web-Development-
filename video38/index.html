<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>css grid</title>
  <style>
    .container {
      width: 80vw;
      height: 100vh;
      border: 2px solid black;
      display: grid;
      /*  grid-template-columns:[phela] 120px [Doosra] 100px [t];
    /*grid-template-rows: 100px 100px 100px; */
      grid-template-columns: 1fr 2fr 1fr;
      gap: 44px;
      row-gap: 10px;
      column-gap: 44px;
    }

    .item {
      border: 2px solid black;
      height: 55px;
      width: 55px;
    }

    .item-4 {
      /* grid-row: 1/2;*/
      /* grid-column: 1/2; */
      grid-row-start: 1;
      grid-row-end: 2;
    }

    .item-1 {
      grid-row: 1/2;
      grid-column: phela/t;

    }
  </style>
</head>

<body>
  <div class="container">
    <div class="item item-1">1</div>
    <div class="item item-2">2</div>
    <div class="item item-3">3</div>
    <div class="item item-4">4</div>
    <div class="item item-5">5</div>
  </div>
</body>

</html>
