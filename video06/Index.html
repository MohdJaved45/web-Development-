<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forms and its Attribute</title>
</head>

<body>
    <h1>Form to Apply To Webdevelopment </h1>
    <form action="post">
        <div>
            <label for="Username">Username</label>
            <input type="text" name="Username" id="Username" placeholder="Enter Your Username" autofocus>
        </div>

        <div>
            <input type="radio" name="Gender" id="male" value="male">
            <label for="male">Male</label>
            <input type="radio" name="Gender" id="female" value="female">
            <label for="female">Female</label>
        </div>
        <div>
            <input type="checkbox" name="subscribe" id="subscribe" value="Yes">
            <label for="subscribe">Subscribe To Newslatter</label>
        </div>

        <div>
            <label for="comment">Enter Your Comment</label><br>
            <textarea name="comment" id="Comment" rows="4" cols="50"> Enter Your Comment....
            </textarea>
        </div>
        <div>
            <select name="fruite" id="">
                <option value="Apple">Apple</option>
                <option value="Banana">Banana</option>
                <option value="Cherry">Cherry</option>  
            </select>
        </div>
    </form>
</body>

</html>
