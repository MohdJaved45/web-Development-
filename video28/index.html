<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exercise 3</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        .box2 {
            border-radius: 26px;
            height: 91vh;
            border: 1px solid black;
            width: 429px;
            padding: 11px;
            margin: 8px;
            padding: 10px;
        }


        .img {
            border-radius: 16px;
            height: 360px;
            width: 404px;
            object-fit: cover;
        }

        /*.nature {
            padding: 42px;
            margin: 26px;
        }

        .lake {
            margin: 47px;
            padding: 19px;
        }*/

        .box span {
            display: inline-block;
            padding: 5px 12px;
            margin-right: 5px;
            border: 1px solid #ddd;
            border-radius: 20px;
            color: #a34eff;
            font-size: 24px;
        }

        h2 {
            padding: 14px;
            text-align: justify;
            margin: 6px;
            /* font-size: large; */
            font-family: sans-serif;
        }

        p {
            text-align: justify;
            color: #a34eff;
            font-family: sans-serif;
            line-height: 1.5;
        }

        button {
            color: #2185d0;
            background-color: #e4f0ff;
            text-align: center;
            padding: 31px 20px;
            margin: 37px auto 5px;
            border-radius: 20px;
            height: 3px;
            width: 132px;
            cursor: pointer;
            border: none;
        }
    </style>
</head>

<body>
    <!--card.png is file  which contains a card Image.Write html and CSS code to design this card -->

        <img class="img"

        <p>Golden Retrievers are friendly, intelligent, and loyal dogs. They are known for their playful nature and make wonderful family companions.
        </p>
