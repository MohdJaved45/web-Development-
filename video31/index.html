<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS Card Design </title>
    <style>
        body {
            background-color: gray;
            padding: 45px;
        }

        .card {
            background-color: white;
            width: 198px;
            height: 344px;
            border-radius: 7px;
            padding: 0 0 34px 0;
        }

        .image {
            padding: 5px;
        }

        .image img {
            border-radius: 7px;
        }

        .content{
            padding: 3px 12px;
            font-family: 'Lucida Sans', 'Lucida Sans Regular', 'Lucida Grande', 'Lucida Sans Unicode', Geneva, Verdana, sans-serif;
        }
        .content p {
            font-size: 9px;
            color: gray;
        }

        .capsules{
            padding:5px 13px;
        }
        .capsules span{
            border: 1px solid black;
            padding: 4px;
            border-radius: 7px;
            font-size: 12px;
            font-family: 'Franklin Gothic Medium', 'Arial Narrow', Arial, sans-serif;
            
        }
        .button{
            text-align: center;
        }
        .button button{
            padding: 4px 7px;
            border-radius: 15px;
            background-color: rgb(164, 145, 245);
            color: blue;
            font-size: 8px;
            border: none;
            margin-top: 3px;
            font-weight: 600;
            cursor: pointer;
            
        }
        .button button:hover{
             background-color: rgb(0, 244, 122);
            color: rgb(245, 0, 196);
        }
    </style>
</head>

<body>
    <div class="card">
        <div class="image">
            <img width="188"
                src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcT7_l5UbHgewnhVWBDFzxlDy5kwCITNG61ZY8o3dpyYz26mXV1FOizWOAGp&s=10"
                alt="">
        </div>

        <div class="capsules">
            <span>Nature</span>
            <span>Lake</span>
        </div>
        <div class="content">
            <h2>Javed</h2>
            <p>Lorem ipsum dolor sit amet consectetur adipisicing elit. Repellendus quo, at nostrum dolorum, nisi quia
                quod cum sunt nesciunt, velit adipisci fuga iure?</p>

        </div>
        <div class="button">
            <button>Read More</button>
        </div>
    </div>


</body>

</html>
