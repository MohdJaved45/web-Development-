<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS Selectors </title>
    <style>
        /*  Element selector */
        div {
            /*  background-color: red; */
        }

        /* class Selector */
        .red {
            background-color: red;
        }

        /*ID Selector */
        #green {
            background-color: rgb(80, 214, 80);
        }

        /*Child Selector*/
        div>p {
            background-color: aquamarine;
            color: rgb(253, 89, 7);

        }

        /*Decendant Selectors*/
        div p {
            background-color: aquamarine;
            color: rgb(253, 89, 7);

        }

        /*Universal selectors*/
        * {
            margin: 0;
            padding: 0;
        }

        /*Pseudo Selector */
        a:visited {
            color: yellow;
        }

        a:link {
            color: green;
        }

       
        a:active {
            background-color: red;
        }

        a:hover{
            background-color: violet;
        }

        p:first-child{
            background-color: aquamarine;
        }

        

    </style>
</head>

<body>
    <main class="one">
        <p>I am One </p>
         <p>I am Second</p>
    </main>

    <div id="green">
        I am a div
    </div>

    <div class="red">
        I am another div
        <article>
            <p>I am a para iside the div </p>
        </article>

    </div>
    <div>
        <a href="https://www.google.com">Go to Google</a>
        <a href="https://www.facebook.com">Go to Facebook</a>
    </div>

</body>

</html>
