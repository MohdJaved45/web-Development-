<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS Task 5</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        nav {
            background-color: blueviolet;
            padding: 1px 0;
            position: sticky;
        }

        ul li {
            list-style: none;
            display: flex;
            padding: 23px;
            display: inline-flex;

        }

        ul li a {
            text-decoration: none;
            color: white;
        }

        .container {

            border: 2px solid black;
            height: 500px;
            width: 100%;
            background-color: rgb(68, 252, 64);
            display: flex;
            margin-top: 4px;
            margin-left: 4px;
            margin-right: 4px;
        }

        .box1 {
            border: 1px solid black;
            height: 327px;
            width: 334px;
            margin: auto auto;
            background-color: pink;
        }

        .box2 {
            border: 1px solid black;
            height: 327px;
            width: 334px;
            margin: 20px;
            background-color: blue;
            margin: auto auto;

        }

        .rect {
            border-radius: 24px;
            height: 97px;
            width: 100%;
            border: 2px solid black;
            text-align: center;
            padding-top: 38px;
            margin-top: 6px;
            font-family: sans-serif;
            font-weight: 600;
            background-color: rgb(164, 255, 225);
        }
        .footer{
            text-align: center;
            background-color:rgb(139, 250, 250) ;
        }
    </style>
</head>

<body>
    <header>
        <nav>
            <ul>
                <li><a href="/">Home</a></li>
                <li><a href="/">About</a></li>
                <li><a href="/">Contact</a></li>
                <li><a href="/">Service</a></li>
            </ul>
        </nav>
    </header>
    <div class="container">
        <div class="box1"></div>
        <div class="box2"></div>
    </div>
    <div class="rect">Welcome To my simple webpage Its Mohd Javed khan</div>

    <div class="footer">
        <footer>
           &copy; All right Reserved By Mohad Javed khan
        </footer>
    </div>
</body>
      
</html>
