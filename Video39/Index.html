<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Layout</title>
    <style>
        * {
            margin: 0;
            padding: 0;

        }

        header {
            position: sticky;
            top: 0;
        }

        nav {
            background-color: pink;
            height: 83px;


        }

        main {
            background-color: black;
            color: white;
            padding: 0 34px;
        }

        .container {
            background-color: green;
            margin: 12px 34px;
            /* height: 233px; */
            text-align: center;
        }

        .box1 {
            background-color: pink;
            height: 70vh;
            width: 45%;
            display: inline-block;
            margin: 0 12px;
        }

        .box2 {
            background-color: blue;
            height: 70vh;
            width: 45%;
            display: inline-block;
            margin: 0 12px;

        }

        footer {
            height: 100px;
            background-color: beige;
        }

        .text-box {
            padding: 34px;
            border: 2px solid white;
            margin: 50px 34vw;
            font-size: 2em;
            border-radius: 13px;
        }

        .orangebox {
            height: 34px;
            width: 35px;
            background: orange;
            position: fixed;
            bottom: 12px;
            right: 23px;
            border-radius: 60px;
        }
    </style>
</head>

<body>
    <header>
        <nav>

        </nav>

    </header>
    </main>

    <div class="container">
        <div class="box1">Box1</div>
        <div class="box2">Box2</div>
    </div>

    <footer>
        <div class="text-box">
            <p>Hello I am Mohd Javed Khan</p>

        </div>
        <div class="orangebox">

        </div>
    </footer>
    <main>
</body>

</html>
