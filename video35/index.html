<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS multi color webpage</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap');
    </style>
    <style>

            :root {
            --color: rgb(188, 100, 246);
            --seccolor: rgb(174, 174, 222);
            --color2: (#2dff76);
            --color3: rgb(#686);
            --color4: rgb(rgb(0, 60, 70));
            --color5: rgb(rgb(11, 36, 11));
            --defpad: 23px;
            --defop: 0.2;
        }
         
        body{
            background-color: var(--seccolor);
        }

        * {
            margin: 0;
            padding: 0;
            font-family: "Poppins", sans-serif;
        }

        nav {
            background-color: var(--color);
            padding: 12px 0;
        }

        ul li {
            list-style: none;
            padding: 23px;
            display: inline;
            color: white;
            font-weight: 400;
        }
         ul li  a{
            color: white;
            text-decoration: none;

        }
    </style>
</head>

<body>
    <header>
        <nav>
            <ul>
                <li><a href="/">Home</a></li>
                <li><a href="/">About</a></li>
                <li><a href="/">Service</a></li>
                <li><a href="/">Contact</a></li>


            </ul>
        </nav>
    </header>
</body>

</html>
